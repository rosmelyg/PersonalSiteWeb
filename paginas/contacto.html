<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
    <header>
        <ul>
            <li><a href="index.html">Volver al Home</a></li>
        </ul>
    </header>
    
    <main>
        <section>
            <h2>Contacto</h2>
            <form action="">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                <br>
                <div>
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido">
                </div>
                <br>
                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo">
                </div>
                <br>
                <div>
                    <label for="descripcion">Descripción de los servicios que desea:</label>
                    <br>
                    <textarea id="descripcion" name="descripcion" rows="5" cols="40"></textarea>
                </div>
                <br>
                <div>
                    <button type="button">Enviar Mensaje</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rosmely Gómez</p>
    </footer>
</body>
</html>
